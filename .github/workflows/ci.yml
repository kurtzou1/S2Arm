# 公开仓 CI：只用 GitHub 托管 runner，不依赖维护者机器、私有 secret 和 S2A_PRIVATE_TOOLS。
#   linux：平台无关的快速门禁；macos：贡献者自检 tools/contrib_check.sh（第一层；第二层由维护者在合入列车里跑）。
name: ci
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: '3.12'
      - name: 分层登记
        run: python3 tools/layer_map.py check
      - name: 单测接线
        run: python3 tools/test_wired_lint.py
      - name: 公开仓扫描（全量）
        run: python3 tools/public_repo_scan.py --repo . --ref HEAD --path . --format gate
  macos:
    # 私有仓 macOS 分钟按 10 倍计：私有时只在手动触发时跑，转公开后自动跑
    if: ${{ github.event.repository.private == false || github.event_name == 'workflow_dispatch' }}
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: '3.12'
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73  # v6.1.0
        with:
          global-json-file: compat/tree/global.json
      - name: bash 5 与钉版 Python 包
        run: |
          brew install bash
          echo "$(brew --prefix)/bin" >> "$GITHUB_PATH"
          # GITHUB_PATH 后写的排在前面：python3 仍是 setup-python 那份，否则装的包和自检用的不是同一个解释器
          echo "$pythonLocation/bin" >> "$GITHUB_PATH"
          python3 -m pip install -r tools/rewriter-requirements.txt -r pack/fonts/requirements.txt
          # 未定义名称门禁与本机检查共用 Ruff 版本登记，不依赖托管镜像预装。
          RUFF_VERSION=$(python3 -c 'import json; print(json.load(open("tools/style-tools.json"))["python_packages"]["ruff"])')
          python3 -m pip install "ruff==$RUFF_VERSION"
      - name: 改写器固定依赖（钉版 Capstone / LZ4 源码；构建本身不下载）
        run: python3 runtime/rewriter/prepare_deps.py build/rewriter-deps
      - name: Windows 启动器离线门禁要的 NuGet 包
        run: python3 tools/nuget_prefetch.py launchers/windows/launcher
      - name: 钉版时区源码（服务层单测生成 tzdata 用）
        run: bash services/systemdata/make_tzdata.sh --prepare-sources
      - name: 共享字体（开源替代 7 个 .bfttf；字体版本与 sha256 在 make_open_fonts.py 里核）
        run: python3 pack/fonts/make_open_fonts.py "$RUNNER_TEMP/openfonts"
      - name: 安卓链接核对前置（钉版 NDK / CMake；版本单一来源 android/docker/Dockerfile 的 ARG SDK_PACKAGES）
        run: |
          SDK=${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}
          [ -n "$SDK" ] || { echo '【红】托管镜像没有 Android SDK（ANDROID_HOME 未设）'; exit 1; }
          "$SDK/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$SDK" "ndk;29.0.14206865" "cmake;3.31.6"
      - name: 兼容层上游基线
        run: bash compat/fetch_base.sh
      # 托管机 3 核跑不完 runtime 钩子，也没有游戏数据和真音频设备：结果只作参考，合入判定由 linux 作业和列车门禁负责
      - name: 贡献者自检（参考，不挡合入）
        id: selfcheck
        continue-on-error: true
        env:
          BASE: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || github.event.before || 'HEAD~1' }}
          S2A_SHARED_FONT_DIR: ${{ runner.temp }}/openfonts
        run: bash tools/contrib_check.sh --base "$BASE"
      - name: 自检没过时打印门禁日志，结论写进摘要
        if: steps.selfcheck.outcome == 'failure'
        run: |
          tail -n 200 build/contrib_check/gate.log
          cat build/contrib_check/summary.md >> "$GITHUB_STEP_SUMMARY"
